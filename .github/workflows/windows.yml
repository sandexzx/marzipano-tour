name: Windows portable app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test offline server
        run: npm test
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version" }
      - name: Build portable Windows x64 EXE
        run: npm run dist:win
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-unpacked/Marzipano Tour.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--enable-unsafe-swiftshader' -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Packaged application test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged application failed: $($process.ExitCode)" }
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Marzipano-Tour-Windows-x64
          path: dist/Marzipano-Tour-*-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = (Get-ChildItem dist/Marzipano-Tour-*-Windows-x64.exe).FullName
          gh release create $env:GITHUB_REF_NAME $file --verify-tag --title "Marzipano Tour $env:GITHUB_REF_NAME" --notes "Portable offline panorama viewer for Windows 10/11 x64. Download the EXE and run it; no installation or internet connection is required. This build is unsigned, so Windows may show a SmartScreen warning."
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
